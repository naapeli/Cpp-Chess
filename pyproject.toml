[project]
name = "cpp-chess-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "chess>=1.11.2",
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_perft.py", "test_evaluation.py", "test_engine.py"]
addopts = "--import-mode=importlib -ra"

[dependency-groups]
dev = [
    "playwright>=1.63.0",
]
